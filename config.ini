[DEFAULT]
# Default scan time in seconds
scan_time = 30

# Number of deauth packets per round
deauth_packets = 10

# Number of deauth rounds
deauth_rounds = 3

# Maximum time to wait for handshake (seconds)
capture_timeout = 180

# Default wordlist path
wordlist_path = /usr/share/wordlists/rockyou.txt

# Optional hashcat rules file (leave empty for none)
hashcat_rules = 

# Output directory for captures
output_dir = ./captures

# Default wireless interface (leave empty for auto-detect)
default_interface = 
